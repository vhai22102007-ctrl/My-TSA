<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Thi Thử Trực Tuyến | TMA TSA</title>
  <link class="favicon" rel="icon" href="https://assets.tmastudy.io.vn/assets/tsa.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(rgba(255, 246, 247, 0.35), rgba(255, 246, 247, 0.35)),
                  url("https://assets.tmastudy.io.vn/assets/nen.png") center center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .portal-card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 40px 48px;
      border: 1px solid #e2e8f0;
      position: relative;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .brand-logo-img {
      width: 100%;
      max-width: 390px;
      height: auto;
      display: block;
      margin: 0 auto 24px;
      object-fit: contain;
    }

    .code-input::placeholder {
      color: #cbd5e1;
      letter-spacing: 4px;
    }

    .code-input:focus {
      border-color: #ba2026 !important;
      box-shadow: 0 0 0 3px rgba(186, 32, 38, 0.12);
      background: #fff;
    }

    /* Fullscreen Portal Iframe wrapper to lock fullscreen mode during redirects */
    #portal-iframe {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 100;
      background: #ffffff;
    }
  </style>
  <link rel="stylesheet" href="css/exam-portal.css">

  <script src="js/supabase-config.js"></script>
  <script src="js/mock-exam-api.js"></script>
</head>
<body>

  <div class="portal-card" id="portal-card">
    <div class="portal-content" id="lobby-ui">
      <div id="phone-entry-panel">
        <img src="https://assets.tmastudy.io.vn/assets/tma-tsa.png" alt="TMA TSA - Kỳ thi đánh giá tư duy" class="brand-logo-img">

        <form id="code-form" novalidate>
          <label class="portal-field-label" for="code-input">Mã dự thi gồm 10 kí tự</label>
          <div class="portal-input-wrap">
            <input type="tel" id="code-input" class="code-input" placeholder="XX XXX XXX XX" maxlength="15" inputmode="numeric" autocomplete="tel" autofocus spellcheck="false">
          </div>
          <p class="error-msg" id="error-msg" role="alert"></p>
          <button type="submit" id="submit-btn" class="portal-submit">Tiếp theo</button>
        </form>

        <div class="portal-footer">
          <span>Mã phòng thi do giáo viên cung cấp</span>
        </div>
      </div>

      <div class="exam-select-panel" id="exam-select-panel" hidden>
        <h2 class="exam-select-title">Chọn kỳ thi</h2>
        <p class="exam-select-copy">Số điện thoại này được đăng ký cho nhiều kỳ thi đang mở. Hãy chọn kỳ thi bạn muốn tham gia.</p>
        <div class="exam-option-list" id="exam-option-list"></div>
        <button class="portal-back" id="exam-select-back" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Nhập số điện thoại khác
        </button>
      </div>
    </div>

    <!-- Premium TMA Study Loading UI -->
    <div id="loading-ui" style="display: none; position: fixed; inset: 0; background: #ffffff; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
      <style>
        @keyframes esl-brandFadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
        @keyframes esl-brandDrawLine{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
        @keyframes esl-brandFillLogo{0%,35%{fill:transparent}45%,85%{fill:#000}100%{fill:transparent}}
        @keyframes esl-brandLoadingBar{0%{transform:scaleX(0);transform-origin:left}49%{transform:scaleX(1);transform-origin:left}50%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
        .esl-brand-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;animation:esl-brandFadeIn .8s ease-out forwards}
        .esl-logo-svg{width:160px;height:160px;margin-bottom:28px;overflow:visible;filter:drop-shadow(0 8px 6px rgba(0,0,0,.12))}
        .esl-logo-path{fill:transparent;stroke:#000;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:esl-brandDrawLine 2.5s cubic-bezier(.4,0,.2,1) infinite alternate, esl-brandFillLogo 5s ease-in-out infinite}
        .esl-face-top{animation-delay:0s,0s}
        .esl-face-left{animation-delay:.2s,.2s}
        .esl-face-right{animation-delay:.4s,.4s}
        .esl-brand-title{margin:0 0 20px;font-family:'Times New Roman',serif;font-size:24px;font-weight:900;letter-spacing:6px;color:#000;text-transform:uppercase;text-align:center}
        .esl-bar-wrap{position:relative;width:160px;height:2px;background:#e0e0e0;overflow:hidden}
        .esl-bar-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;transform-origin:left;animation:esl-brandLoadingBar 2s cubic-bezier(.65,0,.35,1) infinite}
      </style>
      <div class="esl-brand-loader">
        <svg class="esl-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path class="esl-logo-path esl-face-top"  d="M 50 15 L 85 35 L 50 55 L 15 35 Z"/>
          <path class="esl-logo-path esl-face-left" d="M 15 35 L 50 55 L 50 90 L 15 70 Z"/>
          <path class="esl-logo-path esl-face-right" d="M 50 55 L 85 35 L 85 70 L 50 90 Z"/>
        </svg>
        <div class="esl-brand-title">TMA Study</div>
        <div class="esl-bar-wrap"><div class="esl-bar-fill"></div></div>
      </div>
    </div>
  </div>

  <!-- Persistent Fullscreen Portal Iframe -->
  <iframe id="portal-iframe" allow="fullscreen"></iframe>

  <script src="js/exam-page.js"></script>
</body>
</html>
