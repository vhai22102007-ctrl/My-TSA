<!doctype html>
<html lang="vi">
  <head>
    <script src="js/custom-dialogs.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng thi</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/exam-room.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
  <body class="exam-page" data-subject="math">
    <div class="exam-app">
      <!-- LEFT COLUMN -->
      <div class="exam-left-pane">
        <!-- HEADER -->
        <header class="exam-header">
          <div class="header-left">
            <!-- Logo image at the top left of the header -->
            <img src="https://assets.tmastudy.io.vn/assets/logo1.png" class="exam-logo" alt="TMA TSA Logo">
            <span class="exam-title-text" id="header-exam-title"></span>
            <span class="header-candidate-id" id="header-candidate-id"></span>
          </div>
        </header>

        <!-- QUESTION AREA -->
        <main class="question-pane" aria-label="Nội dung câu hỏi">
          <div class="question-card">
            <!-- Question content layout -->
            <div class="question-layout-row">
              <div class="question-number-circle" id="question-number"></div>
              <div class="question-text-content">
                <div class="question-body" id="question-body"></div>
                <form class="answer-area" id="answer-area"></form>
              </div>
              <div class="question-action-column">
                <button class="bookmark-button" type="button" data-action="bookmark" aria-label="Đánh dấu câu chưa chắc chắn">
                  <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
                    <path fill="currentColor" d="m19 18 2 1V3c0-1.1-.9-2-2-2H8.99C7.89 1 7 1.9 7 3h10c1.1 0 2 .9 2 2zM15 5H5c-1.1 0-2 .9-2 2v16l7-3 7 3V7c0-1.1-.9-2-2-2"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </main>

        <!-- FOOTER -->
        <footer class="exam-footer">
          <div class="footer-left">
            <button class="nav-button nav-button-outline" type="button" data-action="previous" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <button class="nav-button nav-button-primary" type="button" data-action="next">
              <span class="button-label">Câu tiếp</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right" aria-hidden="true">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
            
            <!-- Timer is now positioned adjacent to nav controls -->
            <div class="footer-timer">
              <span class="footer-timer-label">Thời gian làm câu hiện tại</span>
              <span id="question-time" class="footer-timer-value">00:00</span>
            </div>
          </div>
          <div class="footer-right"></div>
        </footer>
      </div>

      <!-- RIGHT COLUMN: SIDEBAR -->
      <aside class="exam-sidebar" aria-label="Thông tin và tiến độ bài thi">
        <!-- Candidate info -->
        <div class="sidebar-candidate-info">
          <h2 class="sidebar-title">Thông tin thí sinh</h2>
          <div class="sidebar-info-row">
            <span class="info-label">Họ tên</span>
            <span class="info-value" id="sidebar-candidate-name"></span>
          </div>
          <div class="sidebar-info-row">
            <span class="info-label">Mã dự thi</span>
            <span class="info-value uppercase" id="sidebar-candidate-id"></span>
          </div>
        </div>

        <!-- Timer & Submit Box -->
        <div class="timer-submit-box">
          <div class="timer-inner">
            <span class="timer-label">Thời gian còn lại</span>
            <strong id="countdown" class="timer-value"></strong>
          </div>
          <button class="submit-button" type="button" data-action="submit">Nộp bài</button>
        </div>

        <!-- Color Legend -->
        <div class="color-legend-row">
          <span class="legend-label">Chỉ thị màu sắc:</span>
          <div class="legend-badges">
            <span class="legend-badge is-unanswered" id="stats-unanswered"></span>
            <span class="legend-badge is-answered" id="stats-answered">0</span>
            <span class="legend-badge is-flagged" id="stats-flagged">0</span>
          </div>
        </div>

        <!-- Question Grid -->
        <div class="question-grid-scroll">
          <div class="question-grid" id="question-grid"></div>
        </div>

        <!-- Progress Block (Pushed to bottom of sidebar) -->
        <div class="sidebar-bottom-progress">
          <div class="progress-info-row">
            <span class="progress-title">Bạn đã hoàn thành</span>
            <span class="progress-count"><strong id="progress-done-count">0</strong>/<span id="progress-total-count"></span> câu</span>
          </div>
          <div class="progress-row">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progress-bar" style="width: 0%;"></div>
            </div>
            <span class="progress-percent" id="progress-label">0%</span>
          </div>
          <div class="connection-status">
            <div class="status-dot-wrapper">
              <span class="status-dot-ping"></span>
              <span class="status-dot"></span>
            </div>
            <span class="status-text">Đã kết nối máy chủ</span>
          </div>
        </div>
      </aside>
    </div>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          macros: {
            frac: ["\\dfrac{#1}{#2}", 2]
          }
        },
        options: {
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/question-renderers.js?v=1.0.2"></script>
    <script src="js/question-graders.js"></script>
    <script src="js/exam-room.js?v=1.0.2"></script>
  </body>
</html>
