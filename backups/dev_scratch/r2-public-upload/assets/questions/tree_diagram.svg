<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="100%" height="100%">
  <style>
    .node-white { fill: #ffffff; stroke: #0044cc; stroke-width: 1.5; }
    .node-blue { fill: #0044cc; stroke: #0044cc; stroke-width: 1.5; }
    .line-conn { stroke: #6b7280; stroke-width: 1; stroke-dasharray: none; }
    .line-guide { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4,4; }
    .label-text { font-family: "Times New Roman", serif; font-size: 13px; fill: #000; }
    .title-text { font-family: "Times New Roman", serif; font-size: 14px; font-style: italic; fill: #000; }
  </style>

  <!-- ================= HÌNH 1 ================= -->
  <g transform="translate(10, 10)">
    <!-- Connections -->
    <line x1="60" y1="30" x2="30" y2="80" class="line-conn" />
    <line x1="60" y1="30" x2="90" y2="80" class="line-conn" />
    <!-- Nodes -->
    <circle cx="60" cy="30" r="8" class="node-white" />
    <circle cx="30" cy="80" r="8" class="node-white" />
    <circle cx="90" cy="80" r="8" class="node-blue" />
    <!-- Label -->
    <text x="60" y="115" text-anchor="middle" class="title-text">Hình 1</text>
  </g>

  <!-- ================= HÌNH 2 ================= -->
  <g transform="translate(135, 10)">
    <!-- Connections -->
    <line x1="60" y1="30" x2="20" y2="80" class="line-conn" />
    <line x1="60" y1="30" x2="60" y2="80" class="line-conn" />
    <line x1="60" y1="30" x2="100" y2="80" class="line-conn" />
    <!-- Nodes -->
    <circle cx="60" cy="30" r="8" class="node-blue" />
    <circle cx="20" cy="80" r="8" class="node-blue" />
    <circle cx="60" cy="80" r="8" class="node-blue" />
    <circle cx="100" cy="80" r="8" class="node-white" />
    <!-- Label -->
    <text x="60" y="115" text-anchor="middle" class="title-text">Hình 2</text>
  </g>

  <!-- ================= SƠ ĐỒ LỚN ================= -->
  <g transform="translate(260, 10)">
    <!-- Guideline Rows -->
    <line x1="120" y1="10" x2="330" y2="10" class="line-guide" />
    <line x1="200" y1="70" x2="330" y2="70" class="line-guide" />
    <line x1="230" y1="130" x2="330" y2="130" class="line-guide" />

    <!-- Row Labels -->
    <text x="340" y="14" class="label-text">Hàng 1</text>
    <text x="340" y="74" class="label-text">Hàng 2</text>
    <text x="340" y="134" class="label-text">Hàng 3</text>

    <!-- Connections -->
    <!-- Row 1 to Row 2 -->
    <line x1="120" y1="10" x2="70" y2="70" class="line-conn" />
    <line x1="120" y1="10" x2="170" y2="70" class="line-conn" />

    <!-- Row 2 to Row 3 -->
    <!-- From Left White Node (70, 70) -->
    <line x1="70" y1="70" x2="40" y2="130" class="line-conn" />
    <line x1="70" y1="70" x2="100" y2="130" class="line-conn" />
    
    <!-- From Right Blue Node (170, 70) -->
    <line x1="170" y1="70" x2="140" y2="130" class="line-conn" />
    <line x1="170" y1="70" x2="180" y2="130" class="line-conn" />
    <line x1="170" y1="70" x2="220" y2="130" class="line-conn" />

    <!-- Nodes -->
    <!-- Row 1 -->
    <circle cx="120" cy="10" r="8" class="node-white" />

    <!-- Row 2 -->
    <circle cx="70" cy="70" r="8" class="node-white" />
    <circle cx="170" cy="70" r="8" class="node-blue" />

    <!-- Row 3 -->
    <!-- Left group (from White) -->
    <circle cx="40" cy="130" r="8" class="node-white" />
    <circle cx="100" cy="130" r="8" class="node-blue" />
    
    <!-- Right group (from Blue) -->
    <circle cx="140" cy="130" r="8" class="node-white" />
    <circle cx="180" cy="130" r="8" class="node-blue" />
    <circle cx="220" cy="130" r="8" class="node-blue" />
  </g>
</svg>
