<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%">
  <!-- Style section for font matching -->
  <style>
    .axis-label { font-family: "Times New Roman", serif; font-size: 16px; font-style: italic; fill: #000; }
    .number-label { font-family: "Times New Roman", serif; font-size: 15px; fill: #000; }
    .graph-line { stroke: #0066cc; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dashed-line { stroke: #0066cc; stroke-dasharray: 4,4; stroke-width: 1.2; fill: none; }
    .axis { stroke: #000; stroke-width: 1.2; fill: none; }
    .dot { fill: #0066cc; stroke: #fff; stroke-width: 0.8; }
  </style>

  <defs>
    <!-- Arrow marker for axes -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000" />
    </marker>
  </defs>

  <!-- Dashed Guidelines -->
  <!-- projection for (-1, 1) -->
  <line x1="190" y1="140" x2="190" y2="200" class="dashed-line" />
  <line x1="190" y1="140" x2="310" y2="140" class="dashed-line" />
  <!-- projection for (1, 1) -->
  <line x1="310" y1="140" x2="310" y2="200" class="dashed-line" />
  <!-- projection for (2, -2) -->
  <line x1="370" y1="320" x2="370" y2="200" class="dashed-line" />
  <line x1="370" y1="320" x2="250" y2="320" class="dashed-line" />

  <!-- Axes -->
  <!-- X Axis -->
  <line x1="30" y1="200" x2="430" y2="200" class="axis" marker-end="url(#arrow)" />
  <!-- Y Axis -->
  <line x1="250" y1="350" x2="250" y2="35" class="axis" marker-end="url(#arrow)" />

  <!-- Graph Curve -->
  <path d="M 70 200 L 190 140 Q 250 20 310 140 L 370 320" class="graph-line" />

  <!-- Data Points (Dots) -->
  <circle cx="70" cy="200" r="4.5" class="dot" /> <!-- -3 -->
  <circle cx="130" cy="200" r="4.5" class="dot" /> <!-- -2 -->
  <circle cx="190" cy="200" r="4.5" class="dot" /> <!-- -1 -->
  <circle cx="190" cy="140" r="4.5" class="dot" /> <!-- (-1, 1) -->
  <circle cx="250" cy="80" r="4.5" class="dot" /> <!-- (0, 2) -->
  <circle cx="250" cy="140" r="3.5" class="dot" /> <!-- (0, 1) -->
  <circle cx="250" cy="260" r="3.5" class="dot" /> <!-- (0, -1) -->
  <circle cx="250" cy="320" r="3.5" class="dot" /> <!-- (0, -2) -->
  <circle cx="310" cy="200" r="4.5" class="dot" /> <!-- 1 -->
  <circle cx="310" cy="140" r="4.5" class="dot" /> <!-- (1, 1) -->
  <circle cx="370" cy="200" r="4.5" class="dot" /> <!-- 2 -->
  <circle cx="370" cy="320" r="4.5" class="dot" /> <!-- (2, -2) -->

  <!-- Axis Labels -->
  <text x="422" y="190" class="axis-label">x</text>
  <text x="264" y="45" class="axis-label">y</text>
  <text x="232" y="218" class="number-label">O</text>

  <!-- X axis numbers -->
  <text x="70" y="222" text-anchor="middle" class="number-label">-3</text>
  <text x="130" y="222" text-anchor="middle" class="number-label">-2</text>
  <text x="190" y="222" text-anchor="middle" class="number-label">-1</text>
  <text x="310" y="222" text-anchor="middle" class="number-label">1</text>
  <text x="370" y="190" text-anchor="middle" class="number-label">2</text> <!-- above dot because line goes down -->

  <!-- Y axis numbers -->
  <text x="260" y="84" class="number-label">2</text>
  <text x="260" y="144" class="number-label">1</text>
  <text x="228" y="264" text-anchor="end" class="number-label">-1</text>
  <text x="228" y="324" text-anchor="end" class="number-label">-2</text>
</svg>
