<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d8192f">
    <link rel="icon" href="https://assets.tmastudy.io.vn/assets/tma-tsa.png">
    <title>TMA TSA | Đăng nhập</title>
    <style>
      :root {
        --tsa-red: #df2034;
        --tsa-red-dark: #c90f24;
        --text: #17202b;
        --label: #556071;
        --muted: #7a8391;
        --line: #d7d7d7;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      *::-webkit-scrollbar {
        display: none;  /* Chrome, Safari, Opera */
      }

      ::selection {
        background: #d10b1f;
        color: #ffffff;
      }

      ::-moz-selection {
        background: #d10b1f;
        color: #ffffff;
      }

      img {
        -webkit-user-drag: none;
        -webkit-user-select: none;
        user-select: none;
        user-drag: none;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.62), rgba(255, 232, 235, 0.34)),
          url("https://assets.tmastudy.io.vn/assets/nen.png") center center / cover no-repeat fixed;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      [hidden] {
        display: none !important;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 132px 20px 42px;
      }

      body[data-mode="register"] .page,
      body[data-mode="teacher"] .page {
        padding-top: 60px; /* Pushes the logo and card down from the top */
      }

      .brand-mark {
        display: block;
        width: min(100%, 315px);
        margin: 0 0 32px; /* Increases spacing between logo and card */
      }

      .brand-mark img {
        display: block;
        width: 100%;
        height: auto;
      }

      .auth-card {
        width: min(100%, 460px);
        min-height: 476px;
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 10px 28px rgba(42, 23, 25, 0.18);
        padding: 28px 32px 26px;
        transition: width 0.2s ease;
      }

      body[data-mode="register"] .auth-card {
        width: min(100%, 460px);
        min-height: 0;
        padding-bottom: 22px;
      }

      body[data-mode="teacher"] .auth-card {
        min-height: 0;
        padding-bottom: 22px;
      }

      .auth-title {
        margin: 0;
        color: #17202b;
        font-size: 31px;
        font-weight: 400;
        line-height: 1.24;
        text-align: center;
      }

      .auth-subtitle {
        margin: 18px 0 34px;
        color: #17202b;
        font-size: 15px;
        font-weight: 400;
        text-align: center;
      }

      .auth-subtitle button,
      .text-button {
        border: 0;
        background: transparent;
        color: #e00018;
        padding: 0;
        font: inherit;
      }

      .form {
        display: grid;
        gap: 19px;
      }

      body[data-mode="register"] #register-form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 19px;
      }

      body[data-mode="register"] #register-form .field,
      body[data-mode="register"] #register-form .field.full-width,
      body[data-mode="register"] #register-form .form-error,
      body[data-mode="register"] #register-form .submit-button {
        grid-column: span 1;
      }

      .form-select {
        width: 100%;
        height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: #242936;
        outline: none;
        padding: 0 15px;
        font-size: 15px;
        font-weight: 400;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23556071' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 16px;
      }

      .form-select:focus {
        border-color: rgba(223, 32, 52, 0.72);
        box-shadow: 0 0 0 3px rgba(223, 32, 52, 0.08);
      }

      .field {
        display: grid;
        gap: 9px;
      }

      .field label {
        color: var(--label);
        font-size: 16px;
        font-weight: 400;
        line-height: 1.15;
      }

      .required {
        color: var(--tsa-red);
      }

      .input-wrap {
        position: relative;
      }

      .input-wrap input {
        width: 100%;
        height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: #242936;
        outline: none;
        padding: 0 48px 0 15px;
        font-size: 15px;
        font-weight: 400;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .input-wrap input::placeholder {
        color: #b5bbc4;
      }

      .input-wrap.has-icon input {
        padding-left: 44px;
      }

      .input-wrap input:focus {
        border-color: rgba(223, 32, 52, 0.72);
        box-shadow: 0 0 0 3px rgba(223, 32, 52, 0.08);
      }

      .input-icon {
        position: absolute;
        top: 50%;
        left: 15px;
        width: 16px;
        height: 16px;
        color: #222222;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .toggle-password {
        position: absolute;
        top: 50%;
        right: 11px;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: #888888;
        padding: 0;
        transform: translateY(-50%);
      }

      .toggle-password svg {
        width: 18px;
        height: 18px;
      }

      .submit-button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--tsa-red);
        color: #ffffff;
        font-size: 18px;
        font-weight: 600;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .submit-button:hover,
      .submit-button:focus-visible {
        background: var(--tsa-red-dark);
        outline: none;
      }

      .submit-button:active {
        transform: translateY(1px);
      }

      .forgot-row {
        margin-top: -4px;
      }

      .forgot-row .text-button {
        font-size: 15px;
      }

      .form-error {
        margin: -8px 0 -12px;
        color: var(--tsa-red);
        font-size: 15px;
        font-weight: 500;
        line-height: 1.42;
      }

      .form-error:empty {
        display: none;
      }

      .teacher-link {
        position: fixed;
        right: 16px;
        bottom: 14px;
        color: rgba(223, 32, 52, 0.02);
        font-size: 12px;
        text-decoration: none;
        user-select: none;
      }

      .teacher-link:focus,
      .teacher-link:hover {
        color: rgba(223, 32, 52, 0.7);
      }

      @media (max-width: 720px) {
        .page,
        body[data-mode="register"] .page,
        body[data-mode="teacher"] .page {
          justify-content: flex-start;
          padding: 34px 14px;
        }

        .brand-mark {
          width: min(100%, 280px);
          margin-bottom: 16px;
        }

        .auth-card {
          min-height: 0;
          padding: 24px 18px;
        }

        .auth-title {
          font-size: 28px;
        }

        .auth-subtitle {
          margin: 16px 0 28px;
          font-size: 15px;
        }

        .form {
          gap: 18px;
        }

        .field label {
          font-size: 15px;
        }

        .input-wrap input {
          height: 46px;
          font-size: 15px;
        }

        .submit-button {
          height: 48px;
          font-size: 18px;
        }

        body[data-mode="register"] #register-form {
          grid-template-columns: 1fr;
        }
        body[data-mode="register"] #register-form .field,
        body[data-mode="register"] #register-form .field.full-width,
        body[data-mode="register"] #register-form .form-error,
        body[data-mode="register"] #register-form .submit-button {
          grid-column: span 1;
        }
      }

      @media screen and (max-width: 768px) {
        body[data-mode="login"] .page,
        body[data-mode="register"] .page {
          padding: 40px 16px 24px;
          justify-content: flex-start;
        }

        body[data-mode="register"] .page {
          padding-top: 40px;
        }

        body[data-mode="login"] .brand-mark,
        body[data-mode="register"] .brand-mark {
          width: 100%;
          max-width: 240px;
          margin-bottom: 20px;
        }

        body[data-mode="login"] .auth-card,
        body[data-mode="register"] .auth-card {
          width: 100%;
          max-width: 420px;
          padding: 24px 20px;
          min-height: auto;
        }

        body[data-mode="register"] .auth-card {
          padding-bottom: 20px;
        }

        body[data-mode="login"] .auth-title,
        body[data-mode="register"] .auth-title {
          font-size: 26px;
        }

        body[data-mode="login"] .auth-subtitle,
        body[data-mode="register"] .auth-subtitle {
          margin: 12px 0 24px;
          font-size: 14.5px;
        }

        body[data-mode="login"] .form,
        body[data-mode="register"] .form {
          gap: 16px;
        }

        body[data-mode="login"] .input-wrap input,
        body[data-mode="login"] .form-select,
        body[data-mode="register"] .input-wrap input,
        body[data-mode="register"] .form-select {
          height: 44px;
          font-size: 14.5px;
        }

        body[data-mode="login"] .submit-button,
        body[data-mode="register"] .submit-button {
          height: 46px;
          font-size: 17px;
        }

        body[data-mode="login"] .form-error,
        body[data-mode="register"] .form-error {
          word-break: break-word;
          white-space: normal;
        }
      }

      @media screen and (max-width: 480px) {
        body[data-mode="login"] .page,
        body[data-mode="register"] .page {
          padding: 24px 12px 16px;
        }

        body[data-mode="register"] .page {
          padding-top: 24px;
        }

        body[data-mode="login"] .brand-mark,
        body[data-mode="register"] .brand-mark {
          max-width: 200px;
          margin-bottom: 16px;
        }

        body[data-mode="login"] .auth-card,
        body[data-mode="register"] .auth-card {
          padding: 20px 16px;
          border-radius: 6px;
        }

        body[data-mode="login"] .auth-title,
        body[data-mode="register"] .auth-title {
          font-size: 22px;
        }

        body[data-mode="login"] .auth-subtitle,
        body[data-mode="register"] .auth-subtitle {
          margin: 8px 0 20px;
          font-size: 14px;
        }

        body[data-mode="login"] .form,
        body[data-mode="register"] .form {
          gap: 14px;
        }

        body[data-mode="login"] .field label,
        body[data-mode="register"] .field label {
          font-size: 14px;
        }

        body[data-mode="login"] .input-wrap input,
        body[data-mode="login"] .form-select,
        body[data-mode="register"] .input-wrap input,
        body[data-mode="register"] .form-select {
          height: 42px;
          font-size: 14px;
          border-radius: 6px;
        }

        body[data-mode="login"] .submit-button,
        body[data-mode="register"] .submit-button {
          height: 44px;
          font-size: 16px;
          border-radius: 6px;
        }
      }
    </style>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
  </head>
  <body data-mode="login">
    <main class="page">
      <a class="brand-mark" href="index.html#trang-chu" aria-label="TMA TSA">
        <img src="https://assets.tmastudy.io.vn/assets/tma-tsa.png" alt="TMA TSA - Đại học Bách khoa Hà Nội - Kỳ thi đánh giá tư duy">
      </a>

      <section class="auth-card" aria-label="Khu vực đăng nhập">
        <div id="student-login-view">
          <h1 class="auth-title">Đăng nhập</h1>
          <p class="auth-subtitle">
            Bạn chưa có tài khoản?
            <button type="button" id="show-register">Đăng ký ngay</button>
          </p>

          <form class="form" id="student-form" novalidate>
            <div class="field">
              <label for="login-email">Email <span class="required">*</span></label>
              <div class="input-wrap has-icon">
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input id="login-email" type="text" autocomplete="username" inputmode="email">
              </div>
            </div>

            <div class="field">
              <label for="login-password">Mật khẩu <span class="required">*</span></label>
              <div class="input-wrap has-icon">
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
                <input id="login-password" type="password" autocomplete="current-password">
                <button class="toggle-password" type="button" data-toggle-password="login-password" aria-label="Xem mật khẩu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.7 10.7 0 0 1 12 20C5.64 20 2 12 2 12a19.6 19.6 0 0 1 5.06-5.94"></path>
                    <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
                    <path d="M9.88 4.24A10.4 10.4 0 0 1 12 4c6.36 0 10 8 10 8a19.7 19.7 0 0 1-2.14 3.19"></path>
                    <path d="M2 2l20 20"></path>
                  </svg>
                </button>
              </div>
            </div>

            <p class="form-error" id="student-error" role="alert" aria-live="polite"></p>
            <button class="submit-button" type="submit">Đăng nhập</button>
            <div class="forgot-row">
              <button class="text-button" id="forgot-password" type="button">Quên mật khẩu?</button>
            </div>
          </form>
        </div>

        <div id="student-register-view" hidden>
          <h1 class="auth-title">Đăng ký tài khoản</h1>
          <p class="auth-subtitle">
            Bạn đã có tài khoản?
            <button type="button" id="show-login">Đăng nhập ngay</button>
          </p>

          <form class="form" id="register-form" novalidate>
            <div class="field">
              <label for="register-name">Họ tên <span class="required">*</span></label>
              <div class="input-wrap">
                <input id="register-name" type="text" autocomplete="name" placeholder="Điền đầy đủ họ tên trên CMND/CCCD">
              </div>
            </div>

            <div class="field">
              <label for="register-gender">Giới tính <span class="required">*</span></label>
              <div class="input-wrap">
                <select id="register-gender" class="form-select">
                  <option value="Nam">Nam</option>
                  <option value="Nữ">Nữ</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="register-email">Email <span class="required">*</span></label>
              <div class="input-wrap">
                <input id="register-email" type="text" autocomplete="username" inputmode="email" placeholder="Điền chính xác email để nhận thông tin">
              </div>
            </div>

            <div class="field">
              <label for="register-password">Mật khẩu <span class="required">*</span></label>
              <div class="input-wrap">
                <input id="register-password" type="password" autocomplete="new-password" placeholder="Nhập mật khẩu">
                <button class="toggle-password" type="button" data-toggle-password="register-password" aria-label="Xem mật khẩu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.7 10.7 0 0 1 12 20C5.64 20 2 12 2 12a19.6 19.6 0 0 1 5.06-5.94"></path>
                    <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
                    <path d="M9.88 4.24A10.4 10.4 0 0 1 12 4c6.36 0 10 8 10 8a19.7 19.7 0 0 1-2.14 3.19"></path>
                    <path d="M2 2l20 20"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="register-confirm">Nhập lại mật khẩu <span class="required">*</span></label>
              <div class="input-wrap">
                <input id="register-confirm" type="password" autocomplete="new-password" placeholder="Xác nhận lại mật khẩu">
                <button class="toggle-password" type="button" data-toggle-password="register-confirm" aria-label="Xem mật khẩu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.7 10.7 0 0 1 12 20C5.64 20 2 12 2 12a19.6 19.6 0 0 1 5.06-5.94"></path>
                    <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
                    <path d="M9.88 4.24A10.4 10.4 0 0 1 12 4c6.36 0 10 8 10 8a19.7 19.7 0 0 1-2.14 3.19"></path>
                    <path d="M2 2l20 20"></path>
                  </svg>
                </button>
              </div>
            </div>

            <p class="form-error" id="register-error" role="alert" aria-live="polite"></p>
            <button class="submit-button" type="submit">Đăng ký</button>
          </form>
        </div>

        <div id="teacher-view" hidden>
          <h1 class="auth-title">Đăng nhập giáo viên</h1>
          <p class="auth-subtitle">Khu vực quản trị ẩn TMA TSA</p>

          <form class="form" id="teacher-form" novalidate>
            <div class="field">
              <label for="teacher-email">Email giáo viên <span class="required">*</span></label>
              <div class="input-wrap has-icon">
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input id="teacher-email" type="email" autocomplete="username" placeholder="Nhập email giáo viên">
              </div>
            </div>

            <div class="field">
              <label for="teacher-password">Mật khẩu giáo viên <span class="required">*</span></label>
              <div class="input-wrap has-icon">
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
                <input id="teacher-password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu đã tạo trên Supabase">
                <button class="toggle-password" type="button" data-toggle-password="teacher-password" aria-label="Xem mật khẩu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.7 10.7 0 0 1 12 20C5.64 20 2 12 2 12a19.6 19.6 0 0 1 5.06-5.94"></path>
                    <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
                    <path d="M9.88 4.24A10.4 10.4 0 0 1 12 4c6.36 0 10 8 10 8a19.7 19.7 0 0 1-2.14 3.19"></path>
                    <path d="M2 2l20 20"></path>
                  </svg>
                </button>
              </div>
            </div>

            <p class="form-error" id="teacher-error" role="alert" aria-live="polite"></p>
            <button class="submit-button" type="submit" id="teacher-submit-btn">Đăng nhập</button>
            <div class="forgot-row">
              <button class="text-button" id="back-to-student" type="button">Quay lại đăng nhập</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script>
      (() => {
        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && supabase.createClient && window.SUPABASE_CONFIG) {
          supabaseClient = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
        }

        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        window.scrollTo(0, 0);
        window.addEventListener("pageshow", () => window.scrollTo(0, 0));

        // Fetch wrapper
        async function apiFetch(url) {
          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP error");
            return await res.json();
          } catch (e) {
            console.warn("Fetch failed for " + url, e);
            return null;
          }
        }

        // Initialize provinces
        async function initProvinces() {
          const provinceSelect = document.getElementById("register-province");
          if (!provinceSelect) return;

          const data = await apiFetch("https://provinces.open-api.vn/api/p/");
          if (data && Array.isArray(data)) {
            provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh / Thành phố --</option>';
            data.forEach((p) => {
              const opt = document.createElement("option");
              opt.value = `${p.code}|${p.name}`;
              opt.textContent = p.name;
              provinceSelect.appendChild(opt);
            });
          } else {
            const VIETNAM_PROVINCES = [
              "Hà Nội", "TP. Hồ Chí Minh", "Đà Nẵng", "Hải Phòng", "Cần Thơ", "An Giang", "Bà Rịa - Vũng Tàu", "Bắc Giang", "Bắc Kạn", "Bạc Liêu", "Bắc Ninh", "Bến Tre", "Bình Định", "Bình Dương", "Bình Phước", "Bình Thuận", "Cà Mau", "Cao Bằng", "Đắk Lắk", "Đắk Nông", "Điện Biên", "Đồng Nai", "Đồng Tháp", "Gia Lai", "Hà Giang", "Hà Nam", "Hà Tĩnh", "Hải Dương", "Hậu Giang", "Hòa Bình", "Hưng Yên", "Khánh Hòa", "Kiên Giang", "Kon Tum", "Lai Châu", "Lâm Đồng", "Lạng Sơn", "Lào Cai", "Long An", "Nam Định", "Nghệ An", "Ninh Bình", "Ninh Thuận", "Phú Thọ", "Phú Yên", "Quảng Bình", "Quảng Nam", "Quảng Ngãi", "Quảng Ninh", "Quảng Trị", "Sóc Trăng", "Sơn La", "Tây Ninh", "Thái Bình", "Thái Nguyên", "Thanh Hóa", "Thừa Thiên Huế", "Tiền Giang", "Trà Vinh", "Tuyên Quang", "Vĩnh Long", "Vĩnh Phúc", "Yên Bái"
            ];
            provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh / Thành phố --</option>';
            VIETNAM_PROVINCES.forEach((p) => {
              const opt = document.createElement("option");
              opt.value = p;
              opt.textContent = p;
              provinceSelect.appendChild(opt);
            });
          }
        }

        // Dropdown handlers for province change
        const provinceSelect = document.getElementById("register-province");
        const districtWrap = document.getElementById("district-wrap");
        const wardWrap = document.getElementById("ward-wrap");

        if (provinceSelect && districtWrap && wardWrap) {
          provinceSelect.addEventListener("change", async () => {
            const val = provinceSelect.value;
            districtWrap.innerHTML = '<input id="register-district" type="text" placeholder="Đang tải Quận / Huyện...">';
            wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Đang tải Phường / Xã...">';

            if (!val) {
              districtWrap.innerHTML = '<input id="register-district" type="text" placeholder="Nhập Quận / Huyện">';
              wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Nhập Phường / Xã">';
              return;
            }

            if (val.includes("|")) {
              const [provCode, provName] = val.split("|");
              const districts = await apiFetch(`https://provinces.open-api.vn/api/p/${provCode}?depth=2`);
              if (districts && districts.districts && Array.isArray(districts.districts)) {
                const select = document.createElement("select");
                select.id = "register-district";
                select.className = "form-select";
                select.innerHTML = '<option value="">-- Chọn Quận / Huyện --</option>';
                
                districts.districts.forEach((d) => {
                  const opt = document.createElement("option");
                  opt.value = `${d.code}|${d.name}`;
                  opt.textContent = d.name;
                  select.appendChild(opt);
                });

                districtWrap.innerHTML = "";
                districtWrap.appendChild(select);
                
                wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Chọn Quận / Huyện trước" disabled style="background: #f1f5f9; cursor: not-allowed;">';

                select.addEventListener("change", async () => {
                  const distVal = select.value;
                  wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Đang tải Phường / Xã...">';

                  if (!distVal) {
                    wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Chọn Quận / Huyện trước" disabled style="background: #f1f5f9; cursor: not-allowed;">';
                    return;
                  }

                  const [distCode, distName] = distVal.split("|");
                  const wards = await apiFetch(`https://provinces.open-api.vn/api/d/${distCode}?depth=2`);
                  if (wards && wards.wards && Array.isArray(wards.wards)) {
                    const wardSelect = document.createElement("select");
                    wardSelect.id = "register-ward";
                    wardSelect.className = "form-select";
                    wardSelect.innerHTML = '<option value="">-- Chọn Phường / Xã --</option>';
                    
                    wards.wards.forEach((w) => {
                      const opt = document.createElement("option");
                      opt.value = w.name;
                      opt.textContent = w.name;
                      wardSelect.appendChild(opt);
                    });

                    wardWrap.innerHTML = "";
                    wardWrap.appendChild(wardSelect);
                  } else {
                    wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Nhập Phường / Xã">';
                  }
                });
              } else {
                districtWrap.innerHTML = '<input id="register-district" type="text" placeholder="Nhập Quận / Huyện">';
                wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Nhập Phường / Xã">';
              }
            } else {
              districtWrap.innerHTML = '<input id="register-district" type="text" placeholder="Nhập Quận / Huyện">';
              wardWrap.innerHTML = '<input id="register-ward" type="text" placeholder="Nhập Phường / Xã">';
            }
          });
        }

        initProvinces();

        function lockImageDragging(root = document) {
          root.querySelectorAll("img").forEach((image) => {
            image.draggable = false;
            image.setAttribute("draggable", "false");
          });
        }

        lockImageDragging();
        document.addEventListener("dragstart", (event) => {
          if (event.target?.closest?.("img")) {
            event.preventDefault();
          }
        });

        const loginView = document.getElementById("student-login-view");
        const registerView = document.getElementById("student-register-view");
        const teacherView = document.getElementById("teacher-view");
        const studentForm = document.getElementById("student-form");
        const registerForm = document.getElementById("register-form");
        const teacherForm = document.getElementById("teacher-form");
        const studentError = document.getElementById("student-error");
        const registerError = document.getElementById("register-error");
        const teacherError = document.getElementById("teacher-error");

        const userStorageKey = "tmaTsaUsers";
        const teacherStorageKey = "tmaTsaTeachers";
        const legacyUserStorageKey = ["owl", "Study", "Users"].join("");
        const legacyTeacherStorageKey = ["owl", "Study", "Teachers"].join("");

        function getUsers() {
          try {
            const savedUsers = localStorage.getItem(userStorageKey) || localStorage.getItem(legacyUserStorageKey);
            return savedUsers ? JSON.parse(savedUsers) || [] : [];
          } catch (error) {
            return [];
          }
        }

        function setUsers(users) {
          localStorage.setItem(userStorageKey, JSON.stringify(users));
        }

        function getValue(id) {
          const el = document.getElementById(id);
          return el ? el.value.trim() : "";
        }

        function getCleanValue(id) {
          const raw = getValue(id);
          if (raw.includes("|")) {
            return raw.split("|")[1];
          }
          return raw;
        }

        async function hashPassword(password) {
          if (!window.crypto || !window.crypto.subtle || !window.TextEncoder) {
            return "legacy:" + password;
          }
          const bytes = new TextEncoder().encode(password);
          const digest = await window.crypto.subtle.digest("SHA-256", bytes);
          return "sha256:" + Array.from(new Uint8Array(digest))
            .map((byte) => byte.toString(16).padStart(2, "0"))
            .join("");
        }

        function getLocalTeachers() {
          const defaultTeachers = [];
          try {
            const savedTeacherData = localStorage.getItem(teacherStorageKey) || localStorage.getItem(legacyTeacherStorageKey);
            const savedTeachers = savedTeacherData ? JSON.parse(savedTeacherData) : [];
            if (Array.isArray(savedTeachers) && savedTeachers.length) {
              return [...defaultTeachers, ...savedTeachers];
            }
          } catch (error) {}
          return defaultTeachers;
        }

        async function findLocalTeacher(email, password) {
          const normalizedEmail = email.toLowerCase();
          const passwordHash = await hashPassword(password);
          return getLocalTeachers().find((teacher) => {
            const teacherEmail = String(teacher.email || "").toLowerCase();
            const teacherUsername = String(teacher.username || "").toLowerCase();
            return (teacherEmail === normalizedEmail || teacherUsername === normalizedEmail) && 
                   (String(teacher.password || "") === password || teacher.passwordHash === passwordHash);
          });
        }

        function setMode(mode) {
          document.body.dataset.mode = mode;
          loginView.hidden = mode !== "login";
          registerView.hidden = mode !== "register";
          teacherView.hidden = mode !== "teacher";
          studentError.textContent = "";
          registerError.textContent = "";
          teacherError.textContent = "";
        }

        function showLogin() {
          setMode("login");
          history.replaceState(null, "", "login.html");
          document.title = "TMA TSA | Đăng nhập";
          window.setTimeout(() => document.getElementById("login-email")?.focus(), 60);
        }

        function showRegister() {
          setMode("register");
          history.replaceState(null, "", "login.html#register");
          document.title = "TMA TSA | Đăng ký";
          window.setTimeout(() => document.getElementById("register-name")?.focus(), 60);
        }

        function showTeacher() {
          setMode("teacher");
          history.replaceState(null, "", "login.html#teacher");
          document.title = "TMA TSA | Giáo viên";
          window.setTimeout(() => document.getElementById("teacher-email")?.focus(), 60);
        }

        document.getElementById("show-register").addEventListener("click", showRegister);
        document.getElementById("show-login").addEventListener("click", showLogin);
        document.getElementById("back-to-student").addEventListener("click", showLogin);
        document.getElementById("forgot-password").addEventListener("click", () => {
          studentError.textContent = "Vui lòng liên hệ giáo viên hoặc quản trị viên để đặt lại mật khẩu.";
        });

        document.querySelectorAll("[data-toggle-password]").forEach((button) => {
          button.addEventListener("click", () => {
            const input = document.getElementById(button.dataset.togglePassword);
            if (input) {
              const isVisible = input.type === "password";
              input.type = isVisible ? "text" : "password";
              button.setAttribute("aria-label", isVisible ? "Ẩn mật khẩu" : "Xem mật khẩu");
            }
          });
        });

        const initialHash = window.location.hash;
        if (initialHash === "#register") {
          showRegister();
        } else if (initialHash === "#teacher") {
          showTeacher();
        } else {
          showLogin();
        }

        window.addEventListener("hashchange", () => {
          const h = window.location.hash;
          if (h === "#register") showRegister();
          else if (h === "#teacher") showTeacher();
          else showLogin();
        });

        // Submit Listeners
        studentForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const email = getValue("login-email");
          const password = getValue("login-password");

          if (!email || !password) {
            studentError.textContent = "Vui lòng nhập email và mật khẩu.";
            return;
          }

          let user = null;
          const passwordHash = await hashPassword(password);

          if (supabaseClient) {
            try {
              const { data: rpcRes, error } = await supabaseClient.rpc('login_student', {
                p_email: email.toLowerCase(),
                p_password_hash: passwordHash
              });
              
              if (error) throw error;
              if (rpcRes && rpcRes.success) {
                const tempClient = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey, {
                  global: {
                    headers: {
                      'x-student-email': rpcRes.user.email.toLowerCase(),
                      'x-student-password-hash': rpcRes.user.token
                    }
                  }
                });
                const { data: fullProfile, error: profileErr } = await tempClient
                  .from('students')
                  .select('*')
                  .eq('email', rpcRes.user.email.toLowerCase())
                  .maybeSingle();

                if (profileErr) throw profileErr;
                user = { ...rpcRes.user, ...fullProfile };
              } else {
                studentError.textContent = rpcRes?.message || "Email hoặc mật khẩu không đúng.";
                return;
              }
            } catch (err) {
              console.error("Login database error:", err);
              studentError.textContent = "Lỗi kết nối cơ sở dữ liệu.";
              return;
            }
          }

          if (!user) {
            const users = getUsers();
            const localUser = users.find((item) => {
              const savedLogin = String(item.email || item.username || "").toLowerCase();
              return savedLogin === email.toLowerCase() && (item.passwordHash === passwordHash || item.password === password);
            });

            if (!localUser) {
              studentError.textContent = "Email hoặc mật khẩu không đúng.";
              return;
            }

            user = {
              email: localUser.email || localUser.username,
              name: localUser.name,
              phone: localUser.phone || "",
              cccd: localUser.cccd || "",
              dob: localUser.dob || "",
              gender: localUser.gender || "",
              school: localUser.school || "",
              className: localUser.className || "",
              province: localUser.province || "",
              district: localUser.district || "",
              ward: localUser.ward || "",
              street: localUser.street || ""
            };
          }

          localStorage.setItem("studentInfo", JSON.stringify(user));
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get("redirect") || "select.html";
          window.location.href = redirect;
        });

        registerForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const registerInfo = {
            name: getValue("register-name"),
            email: getValue("register-email"),
            password: getValue("register-password"),
            confirm: getValue("register-confirm"),
            gender: getValue("register-gender") || "Nam"
          };

          if (!registerInfo.name || !registerInfo.email || !registerInfo.password || !registerInfo.confirm) {
            registerError.textContent = "Vui lòng nhập đầy đủ thông tin bắt buộc.";
            return;
          }

          if (registerInfo.password !== registerInfo.confirm) {
            registerError.textContent = "Mật khẩu xác nhận chưa khớp.";
            return;
          }

          const passwordHash = await hashPassword(registerInfo.password);

          if (supabaseClient) {
            try {
              const { error: insertErr } = await supabaseClient
                .from('students')
                .insert({
                  email: registerInfo.email.toLowerCase(),
                  name: registerInfo.name,
                  password_hash: passwordHash,
                  dob: "",
                  gender: registerInfo.gender,
                  cccd: "",
                  phone: "",
                  school: "",
                  class_name: "",
                  province: "",
                  district: "",
                  ward: "",
                  street: ""
                });

              if (insertErr) {
                if (insertErr.code === '23505' || (insertErr.message && insertErr.message.includes('duplicate'))) {
                  registerError.textContent = "Tài khoản này đã tồn tại.";
                  return;
                }
                throw insertErr;
              }
            } catch (dbErr) {
              console.error("Database register error:", dbErr);
              registerError.textContent = "Lỗi cơ sở dữ liệu: Không thể đăng ký tài khoản.";
              return;
            }
          }

          const users = getUsers();
          if (!supabaseClient && users.some((user) => String(user.email || user.username || "").toLowerCase() === registerInfo.email.toLowerCase())) {
            registerError.textContent = "Tài khoản này đã tồn tại.";
            return;
          }

          users.push({
            username: registerInfo.email,
            email: registerInfo.email,
            name: registerInfo.name,
            dob: "",
            gender: registerInfo.gender,
            cccd: "",
            phone: "",
            school: "",
            className: "",
            province: "",
            district: "",
            ward: "",
            street: "",
            passwordHash: passwordHash
          });
          setUsers(users);
          registerForm.reset();

          showLogin();
        });

        teacherForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const email = getValue("teacher-email");
          const password = getValue("teacher-password");
          const btn = document.getElementById("teacher-submit-btn");

          if (!email || !password) {
            teacherError.style.color = "#b91c1c";
            teacherError.textContent = "Vui lòng nhập email và mật khẩu giáo viên.";
            return;
          }

          if (!supabaseClient) {
            teacherError.style.color = "#b91c1c";
            teacherError.textContent = "Lỗi kết nối cơ sở dữ liệu Supabase.";
            return;
          }

          btn.disabled = true;
          btn.textContent = "Đang đăng nhập...";
          teacherError.textContent = "";

          try {
            // Đăng nhập chính quy bằng Supabase Auth (Cloud Assets!)
            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
              email: email.toLowerCase(),
              password: password
            });

            if (authError) throw authError;

            // Dùng token JWT chính chủ vừa lấy được để check quyền trong bảng students
            const tempClient = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey, {
              global: {
                headers: {
                  'Authorization': 'Bearer ' + authData.session.access_token,
                  'x-teacher-token': authData.session.access_token
                }
              }
            });

            const { data: teacher, error: queryError } = await tempClient
              .from('students')
              .select('*')
              .eq('email', email.toLowerCase())
              .eq('role', 'teacher')
              .maybeSingle();

            if (queryError) throw queryError;

            if (teacher) {
              localStorage.setItem(
                "teacherInfo",
                JSON.stringify({
                  email: teacher.email,
                  name: teacher.name || "Giáo viên TMA TSA",
                  role: "teacher",
                  token: authData.session.access_token
                })
              );
              window.location.href = "teacher.html";
            } else {
              await supabaseClient.auth.signOut();
              teacherError.style.color = "#b91c1c";
              teacherError.textContent = "Tài khoản của bạn không có quyền Giáo viên.";
              btn.disabled = false;
              btn.textContent = "Đăng nhập";
            }
          } catch (err) {
            console.error("Auth sign in error:", err);
            teacherError.style.color = "#b91c1c";
            teacherError.textContent = "Email hoặc mật khẩu giáo viên không đúng.";
            btn.disabled = false;
            btn.textContent = "Đăng nhập";
          }
        });
      })();
    </script>
  </body>
</html>
